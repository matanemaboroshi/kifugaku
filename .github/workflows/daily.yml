name: daily-update

on:
  schedule:
    - cron: "17 21 * * *" # 毎日 06:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", "config.json", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    # Run only on the default branch so data and the published site never diverge.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch items
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python scripts/fetch_items.py

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F) snapshot"
          git push

      - name: Build site
        run: python scripts/build_site.py

      # Publishing to the gh-pages branch lets GitHub Pages serve it without
      # any extra repository settings (the branch is picked up automatically).
      - name: Publish to gh-pages
        run: |
          cd public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: $(TZ=Asia/Tokyo date +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
